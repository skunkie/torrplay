name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Update version in package.json
        run: |
          VERSION="${GITHUB_REF_NAME:1}"
          jq --arg ver "$VERSION" '.version = $ver' package.json > tmp.json && mv tmp.json package.json
      - name: Build Client
        env:
          RELEASES_URL: ${{ vars.RELEASES_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Upload client artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client-artifacts
          path: ./client/out

  build-android-library:
    name: Build Android Library
    needs: build-client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Download client artifacts
        uses: actions/download-artifact@v8
        with:
          name: client-artifacts
          path: ./web/static
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Update API spec and regenerate code
        uses: ./.github/actions/generate-api
        with:
          version: ${{ github.ref_name }}
      - name: Build Android Library
        run: |
          mkdir -p ./out
          BUILD_DATE=$(date +%F)
          COMMIT=$(git rev-parse --short=7 HEAD)
          VERSION="${GITHUB_REF_NAME:1}"
          MODULE=github.com/torrplay/torrplay
          LDFLAGS="-X '${MODULE}/internal/buildinfo.BuildDate=${BUILD_DATE}' -X '${MODULE}/internal/buildinfo.Commit=${COMMIT}' -X '${MODULE}/internal/buildinfo.Version=${VERSION}'"
          GOMOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          "$(go env GOPATH)/bin/gomobile" init
          CGO_LDFLAGS="-static-libstdc++" "$(go env GOPATH)/bin/gomobile" bind \
            -target=android \
            -androidapi 24 \
            -ldflags="-s -w -checklinkname=0 ${LDFLAGS}" \
            -trimpath \
            -o ./out/torrplay.aar \
            ./pkg/torrplay
      - name: Upload Android Library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-android-library
          path: ./out/*

  build-application:
    name: Build Application
    needs: build-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download client artifacts
        uses: actions/download-artifact@v8
        with:
          name: client-artifacts
          path: ./web/static
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Update API spec and regenerate code
        uses: ./.github/actions/generate-api
        with:
          version: ${{ github.ref_name }}
      - name: Install go-winres
        if: matrix.goos == 'windows'
        run: go install github.com/tc-hib/go-winres@v0.3.3
      - name: Build Application
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BUILD_DATE=$(date +%F)
          COMMIT=$(git rev-parse --short=7 HEAD)
          VERSION="${GITHUB_REF_NAME:1}"
          MODULE=github.com/torrplay/torrplay
          LDFLAGS="-X '${MODULE}/internal/buildinfo.BuildDate=${BUILD_DATE}' -X '${MODULE}/internal/buildinfo.Commit=${COMMIT}' -X '${MODULE}/internal/buildinfo.Version=${VERSION}'"
          OUTPUT_NAME=torrplay-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME=${OUTPUT_NAME}.exe
            $(go env GOPATH)/bin/go-winres make --arch ${{ matrix.goarch }} --in ./winres/winres.json --out ./cmd/torrplay/rsrc --product-version=${VERSION} --file-version=${VERSION}
          fi
          go build -buildvcs=false -ldflags="-s -w ${LDFLAGS}" -trimpath -o ./bin/$OUTPUT_NAME ./cmd/torrplay
      - name: Upload Release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./bin/*

  build-and-push-docker-image:
    name: Build and Push Docker Image
    needs: [build-application]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-linux-amd64
          path: ./bin
      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-linux-arm64
          path: ./bin
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/torrplay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=A torrent streaming application with memory-managed piece storage.

  build-packages:
    name: Build Packages
    needs: build-application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-artifacts-*
          merge-multiple: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install dependencies for GoReleaser
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot mkisofs
      - name: Create dummy Go file
        run: echo 'package main; func main() {}' > dummy.go
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --skip=validate,publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload GoReleaser artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-build-packages
          path: |
            dist/*.deb
            dist/*.rpm

  build-tauri:
    name: Build Tauri Application
    needs: build-application
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download macOS arm64 artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-darwin-arm64
          path: ./client/src-tauri/binaries
      - name: Rename macOS arm64 artifact
        if: matrix.platform == 'macos-latest'
        run: |
          mv torrplay-darwin-arm64 torrplay-aarch64-apple-darwin
          chmod +x torrplay-aarch64-apple-darwin
        working-directory: ./client/src-tauri/binaries
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./client/src-tauri -> target
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./client
      - name: Update version in all config files
        run: |
          VERSION="${GITHUB_REF_NAME:1}"
          jq --arg ver "$VERSION" '.version = $ver' package.json > tmp.json && mv tmp.json package.json
          jq --arg ver "$VERSION" '.version = $ver' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i.bak 's/^version\s*=\s*".*"/version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
        working-directory: ./client
      - name: Build Tauri app
        env:
          APP_ARCH: ${{ runner.arch }}
          RELEASES_URL: ${{ vars.RELEASES_URL }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ./client
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-tauri-${{ matrix.platform }}
          path: |
            ./client/src-tauri/target/release/bundle/deb/*.deb
            ./client/src-tauri/target/release/bundle/rpm/*.rpm
            ./client/src-tauri/target/release/bundle/appimage/*.AppImage
            ./client/src-tauri/target/release/bundle/msi/*.msi
            ./client/src-tauri/target/release/bundle/nsis/*.exe
            ./client/src-tauri/target/release/bundle/dmg/*.dmg
  build-msi:
    name: Build MSI
    needs: build-application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download application artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-windows-*
          merge-multiple: true
          path: ./bin
      - name: Install WiX and required extensions
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.Firewall.wixext -acceptEula wix7
          wix extension add WixToolset.UI.wixext -acceptEula wix7
          wix extension add WixToolset.Util.wixext -acceptEula wix7
        shell: pwsh
      - name: Build MSI
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $VERSION = $env:REF_NAME.Substring(1)
          # MSI ProductVersion must be numeric; drop any prerelease suffix.
          $MSI_VERSION = ($VERSION -split '-')[0]

          wix build -arch x64 `
            -ext WixToolset.Firewall.wixext `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d ServiceFile=./bin/torrplay-windows-amd64.exe `
            -d LicenseFile=./LICENSE `
            -d Version="$MSI_VERSION" `
            -out "./bin/TorrPlay-${VERSION}-x64.msi" ./wix/installer.wxs -acceptEula wix7

          wix build -arch arm64 `
            -ext WixToolset.Firewall.wixext `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d ServiceFile=./bin/torrplay-windows-arm64.exe `
            -d LicenseFile=./LICENSE `
            -d Version="$MSI_VERSION" `
            -out "./bin/TorrPlay-${VERSION}-arm64.msi" ./wix/installer.wxs -acceptEula wix7
        shell: pwsh
      - name: Upload MSI Assets
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-msi
          path: ./bin/*.msi

  build-android:
    name: Build Android
    needs: [build-client, build-android-library]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Download Client artifacts
        uses: actions/download-artifact@v8
        with:
          name: client-artifacts
          path: ./client/out
      - name: Install client dependencies and Sync Capacitor
        run: |
          pnpm install --frozen-lockfile
          npx cap sync android
        working-directory: ./client
      - name: Download Android Library artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-android-library
          path: ./client/android/app/libs/
      - name: Decode signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 -d > ${{ runner.temp }}/keystore.jks
      - name: Build Android Release
        env:
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASES_URL: ${{ vars.RELEASES_URL }}
        run: |
          mkdir -p ./out
          cd ./android

          VERSION="${GITHUB_REF_NAME:1}"
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3 | cut -d- -f1)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          sed -i \
              -e "s/versionCode 1/versionCode ${VERSION_CODE}/g" \
              -e "s/versionName \"1.0\"/versionName \"${VERSION}\"/g" \
              ./app/build.gradle

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ runner.temp }}/keystore.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            -PgithubReleasesUrl=$RELEASES_URL

          for apk in ./app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            arch=$(echo "$base" | sed -E 's/.*-(armeabi-v7a|arm64-v8a|x86|x86_64|universal)-.*/\1/')
            basedir=$(dirname "$apk")
            if [ "$arch" != "$base" ]; then
              mv "$apk" "${basedir}/torrplay-android-${arch}.apk"
            fi
          done
        working-directory: ./client
      - name: Upload Release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-android
          path: ./client/android/app/build/outputs/apk/release/*.apk

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  create-release:
    name: Create GitHub Release
    needs:
      [
        build-android-library,
        build-android,
        build-application,
        build-msi,
        build-packages,
        build-tauri,
        build-and-push-docker-image,
        changelog,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-artifacts-*
          merge-multiple: true
      - name: Collect assets and generate checksums
        run: |
          mkdir -p release
          find release-artifacts -type f -printf '%f\n' | sort | uniq -d > "${RUNNER_TEMP}/duplicates.txt"
          if [ -s "${RUNNER_TEMP}/duplicates.txt" ]; then
            echo "::error::Release assets with duplicate file names would overwrite each other:"
            cat "${RUNNER_TEMP}/duplicates.txt"
            exit 1
          fi
          find release-artifacts -type f -exec mv -t release {} +
          (cd release && sha256sum * > "${RUNNER_TEMP}/SHA256SUMS.txt")
          mv "${RUNNER_TEMP}/SHA256SUMS.txt" release/
          ls -l release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.release_body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
